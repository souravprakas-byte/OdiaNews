name: Odisha News Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - - name: Install dependencies
  run: |
    pip install requests feedparser python-dateutil scikit-learn
    pip install sentence-transformers

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit DB updates
        run: |
          git config --global user.name "news-bot"
          git config --global user.email "bot@github.com"
          git add news_db.json
          git commit -m "auto: update news db" || echo "no changes"
          git push
